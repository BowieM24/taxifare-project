<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaxiFare™ Blueprint Interface</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 50px; }
        
        /* Container that holds your uploaded blueprint image */
        .blueprint-container {
            position: relative;
            width: 1000px; /* Match the aspect ratio of your image */
            height: 400px;
            background-image: url('../assets/14 Seater.svg'); /* Your uploaded file */
            background-size: contain;
            background-repeat: no-repeat;
            border: 5px solid #333;
            border-radius: 15px;
        }

        /* The dynamic "Seat Light" that sits on top of the image seats */
        .seat-indicator {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 5px;
            background: rgba(255, 0, 0, 0.3); /* Transparent Red for Unpaid */
            border: 2px solid red;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            transition: all 0.5s ease;
        }

        .paid {
            background: rgba(0, 255, 0, 0.6) !important; /* Green for Paid */
            border-color: #00ff00 !important;
            box-shadow: 0 0 15px #00ff00;
        }

        /* Precise coordinate mapping to match Image 2 exactly */
        #seat-1  { top: 220px; left: 180px; } /* Front Passenger */
        #seat-2  { top: 50px;  left: 380px; } /* Row 2 Left */
        #seat-3  { top: 50px;  left: 430px; } /* Row 2 Mid */
        #seat-4  { top: 220px; left: 530px; } /* Row 2 Right */
        /* ... add remaining seat coordinates here ... */
    </style>
</head>
<body>

<div class="dashboard-frame">
    <h2>Toyota Quantum 16-Seater Telematics</h2>
    <p style="margin: 0 0 15px 0; color: #a0aec0; font-size: 13px;">Live Floorplan Stream: <span style="color:#fff">Bree Rank Fleet #4</span></p>
    <div class="status-badge" id="status-light">CONNECTING...</div>

    <div class="vehicle-hull">
        <div class="cabin-separator"></div>
        
        <div class="cockpit-section">
            <div class="seat driver-seat">DRV</div>
            <div class="seat unpaid" id="seat-1">S1</div>
        </div>

        <div class="passenger-cabin">
            
            <div class="top-deck-row">
                <div class="seat-block">
                    <div class="seat unpaid" id="seat-2">S2</div>
                    <div class="seat unpaid" id="seat-3">S3</div>
                </div>
                <div class="seat-block">
                    <div class="seat unpaid" id="seat-6">S6</div>
                    <div class="seat unpaid" id="seat-7">S7</div>
                </div>
                <div class="seat-block">
                    <div class="seat unpaid" id="seat-10">S10</div>
                    <div class="seat unpaid" id="seat-11">S11</div>
                </div>
            </div>

            <div class="mid-deck-row">
                <div class="seat unpaid" id="seat-8">S8</div>
                <div class="seat unpaid" id="seat-12">S12</div>
            </div>

            <div class="bottom-deck-row">
                <div class="seat unpaid" id="seat-4">S4</div>
                <div class="seat unpaid" id="seat-5">S5</div>
                <div class="seat unpaid" id="seat-9">S9</div>
            </div>

        </div>

        <div class="rear-bench-column">
            <div class="seat unpaid" id="seat-13">S13</div>
            <div class="seat unpaid" id="seat-14">S14</div>
            <div class="seat unpaid" id="seat-15">S15</div>
            <div class="seat unpaid" id="seat-16">S16</div>
        </div>

    </div>
</div>

<script>
    // Existing WebSocket logic remains the same
    const ws = new WebSocket(`ws://localhost:8000/ws/fleet/bree-quantum-xyz-789`);
    ws.onmessage = (event) => {
        const payload = JSON.parse(event.data);
        if (payload.event === "SEAT_UPDATE" && payload.status === "PAID") {
            const target = document.getElementById(`seat-${payload.seat_number}`);
            if (target) target.classList.add("paid");
        }
    };
</script>

</body>
</html>
