stages:
  - test

variables:
  # Configure a temporary PostgreSQL service container for tests
  POSTGRES_DB: taxifare_test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  POSTGRES_HOST_AUTH_METHOD: trust
  # Connection string used by SQLAlchemy inside CI
  DATABASE_URL: "postgresql+asyncpg://test_user:test_password@postgres/taxifare_test_db"
  PYTHONPATH: "."

default:
  image: python:3.11-slim

services:
  - name: postgres:15-alpine
    alias: postgres

cache:
  paths:
    - .cache/pip

before_script:
  # Install system dependencies if required (e.g., libpq-dev for asyncpg)
  - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install pytest pytest-asyncio httpx aiosqlite

pytest_integration_tests:
  stage: test
  script:
    - echo "🚀 Running TaxiFare™ Automated Integration Test Suite..."
    - pytest -v tests/
  only:
    - merge_requests
    - main
    - master
    - develop
