
services:
# ---------------------------------------------------
# PostgreSQL Database Service
# ---------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: taxifare_postgres
    restart: always
    environment:
      POSTGRES_DB: taxifare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taxifare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

# ---------------------------------------------------
# Redis Cache & State Engine Service 
# ---------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: taxifare_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: